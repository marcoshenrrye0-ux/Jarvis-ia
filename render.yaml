services:
  - type: web
    name: jarvis-api
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: LLM_API_KEY
        sync: false
      - key: LLM_BASE_URL
        value: https://api.groq.com/openai/v1
      - key: LLM_MODEL
        value: llama-3.3-70b-versatile
      - key: DATABASE_PATH
        value: /tmp/jarvis.db
      - key: FRONTEND_ORIGINS
        value: https://jarvis-web.onrender.com
  - type: web
    name: jarvis-web
    runtime: static
    rootDir: frontend
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        fromService:
          type: web
          name: jarvis-api
          envVarKey: RENDER_EXTERNAL_URL
